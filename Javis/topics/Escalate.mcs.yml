  actions:
    - kind: SendActivity
      id: sendMessage_s39DCt
      conversationOutcome: Escalated
      activity: |-
        ขณะนี้ยังไม่มีการตั้งค่าให้ส่งเรื่องต่อไปยังเจ้าหน้าที่สำหรับ Copilot นี้ แต่เอเจนต์สามารถให้ข้อมูลเกี่ยวกับวิธีติดต่อกับบุคคลอื่นด้วยวิธีอื่นได้

        มีอะไรให้ฉันช่วยอีกไหม