mcs.metadata:
  componentName: ส่งเรื่องต่อ
  description: |-
    หัวข้อของระบบนี้จะทริกเกอร์เมื่อผู้ใช้ระบุว่าต้องการพูดคุยกับเจ้าหน้าที่
    คุณสามารถกำหนดค่าว่าเอเจนต์จะจัดการกับสถานการณ์การส่งต่อให้มนุษย์ได้อย่างไรในการตั้งค่าเอเจนต์
    หากเอเจนต์ของคุณไม่มีการส่งเรื่องต่อ หัวข้อนี้ควรถูกปิดใช้งาน
kind: AdaptiveDialog
startBehavior: CancelOtherTopics
beginDialog:
  kind: OnEscalate
  id: main
  intent:
    displayName: ส่งเรื่องต่อ
    includeInOnSelectIntent: false
